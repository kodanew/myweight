<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체중 달력</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="체중달력">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">

<style>
:root{color-scheme:light;--bg:#f6f6f8;--card:#fff;--ink:#111;--mut:#8a8a90;--line:#e6e6ea;--acc:#111;--red:#d9534f;--blue:#3f6fd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:110px}
.page{display:none;padding:14px 14px 0}.page.on{display:block}
h2{font-size:18px;margin:6px 0 12px;font-weight:800}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.05);margin-bottom:14px}
.hd{display:flex;align-items:center;justify-content:center;gap:22px;margin:4px 0 10px}
.hd b{font-size:19px;letter-spacing:1px}.hd button,.ic{background:none;border:0;font-size:22px;padding:6px 10px;cursor:pointer;color:var(--ink)}
.dow,.wk .cells{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cal{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.wk{position:relative;height:120px;border-top:1px solid var(--line)}
.cells{position:absolute;inset:0}
.cell{border-right:1px solid var(--line);padding:5px 0 0 6px;position:relative;cursor:pointer}
.cell:last-child{border:0}
.cell .n{font-size:13px;font-weight:600;display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px}
.cell.sun .n{color:var(--red)}.cell.sat .n{color:var(--blue)}.cell.out .n{opacity:.35}
.cell.today .n{background:#111;color:#fff}
.cell .st{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:12px;white-space:nowrap}
.ov{position:absolute;inset:0;pointer-events:none}
.ov svg{position:absolute;inset:0;width:100%;height:100%}
.dot.ex{background:#f08a24;width:6px;height:6px;margin:-3px 0 0 -3px}.lb.ex{color:#e07b12;font-size:10px;margin-top:-5px}.dot{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#111}
.lb{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:700;margin-top:-6px}
.big{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px}
.big input{font-size:64px;font-weight:800;width:190px;text-align:center;border:0;outline:0;background:none;color:var(--ink);font-family:inherit}
.big small{font-size:22px;font-weight:700;margin-top:26px}
.step{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.row label{width:46px;font-size:14px;font-weight:700}
input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sb{background:#fff;border:2px solid transparent;border-radius:16px;padding:8px 0 6px;text-align:center;font-size:11px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sb i{display:block;font-style:normal;font-size:26px;line-height:1.2}
.sb.on{border-color:#111;background:#f2f2f4}
.btn{width:100%;background:#111;color:#fff;border:0;border-radius:26px;padding:16px;font-size:17px;font-weight:700;margin-top:6px;cursor:pointer}
.btn.sec{background:#fff;color:#111;border:1px solid var(--line);font-weight:600;font-size:15px;padding:13px}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chip{flex:1;border:0;background:#ececf0;border-radius:18px;padding:9px 0;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:#111;color:#fff}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:#8a8a90}
.chg{font-size:40px;font-weight:800}.chg small{font-size:16px;color:var(--mut)}
.pill{display:inline-block;background:#ececf0;border-radius:14px;padding:4px 12px;font-weight:700;font-size:15px;vertical-align:middle;margin-left:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini{border:1px solid var(--line);border-radius:16px;padding:10px;background:#fafafb}
.mini span{font-size:12px;color:var(--mut)}.mini b{display:block;font-size:19px;margin-top:4px}
.bar{height:12px;background:#e9e9ed;border-radius:6px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:#111;border-radius:6px}
.msg{font-size:15px;line-height:1.5;font-weight:600}
.sc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sc span{background:#f2f2f4;border-radius:14px;padding:5px 10px;font-size:13px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(494px,calc(100% - 24px));background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-radius:34px;box-shadow:0 6px 26px rgba(0,0,0,.14);display:flex;padding:6px;z-index:9}
nav button{flex:1;border:0;background:none;border-radius:28px;padding:9px 0 7px;font-size:11px;font-weight:600;color:#111;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{background:#e8e8ec}
.mut{color:var(--mut);font-size:13px}
</style></head><body>

<section class="page on" id="p-cal">
<div class="hd"><button onclick="mv(-1)">‹</button><b id="ttl"></b><button onclick="mv(1)">›</button></div>
<div class="cal"><div class="dow"><div style="color:var(--red)">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div style="color:var(--blue)">토</div></div><div id="weeks"></div></div>
<p class="mut" style="text-align:center"><b style="color:#111">●</b> 체중 &nbsp; <b style="color:#f08a24">●</b> 운동 시간 &nbsp;·&nbsp; 날짜를 누르면 입력해요</p>
</section>

<section class="page" id="p-in">
<div class="row"><input type="date" id="dt" onchange="loadDay()"><button class="ic" onclick="setDate(today())" style="font-size:14px;font-weight:700;white-space:nowrap">오늘</button></div>
<div class="card big"><button class="step" onclick="bump(-.1)">−</button><input id="w" type="number" step="0.1" inputmode="decimal" placeholder="체중" onfocus="clr(this)" onblur="rst(this)" onkeydown="if(event.key==='Enter'){this.blur();save()}"><small>kg</small><button class="step" onclick="bump(.1)">+</button></div>
<button class="btn" style="margin:0 0 14px" onclick="save()">저장</button>
<div class="card"><div class="row" style="margin:0"><label style="width:70px">🏃 운동</label><input type="number" id="ex" step="0.5" min="0" inputmode="decimal" placeholder="0" onfocus="clr(this)" onblur="rst(this)"><span style="font-weight:700;white-space:nowrap">시간</span></div><div class="chips" style="margin:10px 0 0"><button class="chip" onclick="exq(.5)">0.5</button><button class="chip" onclick="exq(1)">1</button><button class="chip" onclick="exq(1.5)">1.5</button><button class="chip" onclick="exq(2)">2</button></div></div>
<div class="card"><h2>식사 기록</h2>
<div class="row"><label>🌅 아침</label><input type="text" id="m0" placeholder="무엇을 먹었나요?"></div>
<div class="row"><label>☀️ 점심</label><input type="text" id="m1" placeholder="무엇을 먹었나요?"></div>
<div class="row"><label>🌆 저녁</label><input type="text" id="m2" placeholder="무엇을 먹었나요?"></div>
<div class="row" style="margin:0"><label>🌙 밤</label><input type="text" id="m3" placeholder="야식·간식"></div></div>
<h2>스탬프</h2><div class="stamps" id="stamps"></div>
<div class="card" style="margin-top:14px"><textarea id="memo" rows="2" placeholder="메모"></textarea></div>
<button class="btn sec" style="margin-top:8px" onclick="delDay()">이 날 기록 삭제</button>
</section>

<section class="page" id="p-gr">
<h2>그래프</h2>
<div class="chips" id="chips"></div>
<div class="card"><svg class="chart" id="chart" viewBox="0 0 340 210"></svg></div>
<div class="card" id="stat"></div>
</section>

<section class="page" id="p-set">
<h2>설정</h2>
<button class="btn" id="inst" style="display:none;margin:0 0 14px" onclick="doInst()">📲 앱으로 설치하기</button>
<div class="card"><div class="row"><label style="width:80px">목표 체중</label><input type="number" step="0.1" id="goal" placeholder="kg"></div>
<div class="row" style="margin:0"><label style="width:80px">키 (BMI)</label><input type="number" step="0.1" id="ht" placeholder="cm"></div></div>
<button class="btn" onclick="saveSet()">설정 저장</button>
<button class="btn sec" style="margin-top:8px" onclick="demo()">예시 데이터 불러오기</button>
<button class="btn sec" style="margin-top:8px;color:var(--red)" onclick="resetAll()">모든 데이터 삭제</button>
<p class="mut">데이터는 이 기기의 브라우저에만 저장돼요.</p>
</section>

<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const STAMPS=[['🍚','식사'],['🥗','샐러드'],['🍰','케이크'],['🍺','음주'],['🏃','운동'],['🚶','걷기'],['🏋️','근력 운동'],['🧘','요가'],['🌙','생리'],['😊','좋음'],['😟','나쁨'],['🛁','목욕'],['😴','잘 자요'],['⭕','동그라미'],['❌','엑스']];
let D={days:{},goal:59,height:''},view=new Date(),cur=null,sel=new Set(),range=30;
view.setDate(1);
try{const s=localStorage.getItem('wcal');if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
const persist=()=>{try{localStorage.setItem('wcal',JSON.stringify(D))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>ymd(new Date());
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
const fromDn=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())};
const recs=()=>Object.keys(D.days).filter(k=>D.days[k].w!=null).sort().map(k=>({t:dn(k),w:D.days[k].w,k}));

// nav
[['cal','📅','달력'],['in','✏️','입력'],['gr','📈','그래프'],['set','⚙️','설정']].forEach(([id,e,l])=>{const b=document.createElement('button');b.dataset.id=id;b.innerHTML=`<i>${e}</i>${l}`;b.onclick=()=>{if(id==='in')setDate(today());tab(id)};$('#nav').appendChild(b)});
function tab(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 if(id==='cal')renderCal();if(id==='gr')renderGraph();if(id==='set'){$('#goal').value=D.goal||'';$('#ht').value=D.height||''}if(id==='in'&&!cur)setDate(today());scrollTo(0,0)}

// calendar
function mv(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCal()}
function renderCal(){
 const y=view.getFullYear(),m=view.getMonth();$('#ttl').textContent=`${y}년 ${m+1}월`;
 const off=view.getDay(),dim=new Date(y,m+1,0).getDate(),nw=Math.ceil((off+dim)/7);
 const first=dn(`${y}-${p2(m+1)}-01`)-off,T=today(),end=first+nw*7;
 const WS=recs().map(r=>({t:r.t,v:r.w})),ES=Object.keys(D.days).filter(k=>D.days[k].ex>0).sort().map(k=>({t:dn(k),v:D.days[k].ex}));
 const vw=WS.filter(r=>r.t>=first&&r.t<end).map(r=>r.v),ve=ES.filter(r=>r.t>=first&&r.t<end).map(r=>r.v);
 const mn=Math.min(...vw),mx=Math.max(...vw),sp=(mx-mn)||1,mxE=Math.max(1,...ve);
 const YW=v=>Math.max(32,Math.min(66,36+(mx-v)/sp*26)),YE=v=>Math.max(82,Math.min(98,98-v/mxE*14));
 let h='';
 for(let k=0;k<nw;k++){
  const rs=first+k*7;let cells='';
  for(let i=0;i<7;i++){const k2=fromDn(rs+i),d=D.days[k2],mo=+k2.slice(5,7)-1;
   const st=d&&d.stamps?d.stamps.slice(0,3).map(i=>STAMPS[i][0]).join('')+(d.stamps.length>3?'+':''):'';
   cells+=`<div class="cell ${i==0?'sun':i==6?'sat':''} ${mo!==m?'out':''} ${k2===T?'today':''}" onclick="go('${k2}')"><span class="n">${+k2.slice(8)}</span><div class="st">${st}</div></div>`}
  const line=(arr,Yf,col,fm,cls)=>{const inr=arr.filter(r=>r.t>=rs&&r.t<rs+7);if(!inr.length)return'';
   const prev=[...arr].reverse().find(r=>r.t<rs),nx=arr.find(r=>r.t>=rs+7);
   const pts=[...(prev?[prev]:[]),...inr,...(nx?[nx]:[])].map(r=>`${r.t-rs+.5},${Yf(r.v)}`).join(' ');
   return `<svg viewBox="0 0 7 120" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`+inr.map(r=>{const l=(r.t-rs+.5)/7*100,t=Yf(r.v);return `<div class="dot ${cls}" style="left:${l}%;top:${t}px"></div><div class="lb ${cls}" style="left:${l}%;top:${t}px">${fm(r.v)}</div>`}).join('')};
  const ov=line(WS,YW,'#111',v=>v.toFixed(1),'')+line(ES,YE,'#f08a24',v=>(+v.toFixed(1))+'h','ex');
  h+=`<div class="wk"><div class="cells">${cells}</div><div class="ov">${ov}</div></div>`}
 $('#weeks').innerHTML=h}
function go(k){setDate(k);tab('in')}

// input
STAMPS.forEach((s,i)=>{const b=document.createElement('div');b.className='sb';b.innerHTML=`<i>${s[0]}</i>${s[1]}`;b.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('on')};b.dataset.i=i;$('#stamps').appendChild(b)});
function setDate(k){cur=k;$('#dt').value=k;loadDay()}
function loadDay(){cur=$('#dt').value||today();const d=D.days[cur]||{};
 $('#w').value=d.w!=null?d.w.toFixed(1):'';
 for(let i=0;i<4;i++)$('#m'+i).value=(d.meals||[])[i]||'';
 $('#ex').value=d.ex>0?d.ex:'';$('#memo').value=d.memo||'';sel=new Set(d.stamps||[]);
 document.querySelectorAll('.sb').forEach(b=>b.classList.toggle('on',sel.has(+b.dataset.i)));
 if(d.w==null){const r=recs().filter(r=>r.k<cur).pop();$('#w').placeholder=r?r.w.toFixed(1):'0.0'}}
function clr(e){e.dataset.prev=e.value;e.value=''}
function rst(e){if(e.value==='')e.value=e.dataset.prev||''}
function exq(v){$('#ex').value=v}
function bump(v){const i=$('#w'),b=parseFloat(i.value)||parseFloat(i.placeholder)||60;i.value=(Math.round((b+v)*10)/10).toFixed(1)}
function save(){const w=parseFloat($('#w').value);
 const meals=[0,1,2,3].map(i=>$('#m'+i).value.trim()),memo=$('#memo').value.trim(),stamps=[...sel].sort((a,b)=>a-b);
 const ex=parseFloat($('#ex').value)>0?parseFloat($('#ex').value):0;
 if(isNaN(w)&&!meals.some(Boolean)&&!memo&&!stamps.length&&!ex){delete D.days[cur]}
 else D.days[cur]={w:isNaN(w)?null:w,meals,memo,stamps,ex};
 persist();view=new Date(+cur.slice(0,4),+cur.slice(5,7)-1,1);toast('저장했어요 ✓');tab('cal')}
function delDay(){if(confirm('이 날의 기록을 삭제할까요?')){delete D.days[cur];persist();loadDay();toast('삭제했어요')}}
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:20';document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}

// graph
[[7,'1주'],[30,'1개월'],[90,'3개월'],[0,'전체']].forEach(([v,l])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{range=v;renderGraph()};b.dataset.v=v;$('#chips').appendChild(b)});
function renderGraph(){
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',+b.dataset.v===range));
 const all=recs(),T=dn(today());
 let R=range?all.filter(r=>r.t>T-range):all;
 const svg=$('#chart'),st=$('#stat');
 if(R.length<1){svg.innerHTML='<text x="170" y="105" text-anchor="middle" style="font-size:13px">기록이 없어요. 입력 탭에서 체중을 기록해보세요</text>';st.innerHTML='';return}
 const g=+D.goal||null,t0=R[0].t,t1=Math.max(R[R.length-1].t,t0+1);
 const ws=R.map(r=>r.w).concat(g?[g]:[]);let lo=Math.floor(Math.min(...ws)-.5),hi=Math.ceil(Math.max(...ws)+.5);
 const L=34,Rr=326,Tp=16,B=176,X=t=>L+(t-t0)/(t1-t0)*(Rr-L),Y=w=>Tp+(hi-w)/(hi-lo)*(B-Tp);
 let s='<defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#999" stop-opacity=".35"/><stop offset="1" stop-color="#999" stop-opacity="0"/></linearGradient></defs>';
 for(let i=0;i<=3;i++){const w=hi-(hi-lo)*i/3,y=Y(w);s+=`<line x1="${L}" x2="${Rr}" y1="${y}" y2="${y}" stroke="#e6e6ea"/><text x="${L-5}" y="${y+3}" text-anchor="end">${w.toFixed(1)}</text>`}
 const pts=R.map(r=>`${X(r.t)},${Y(r.w)}`).join(' ');
 s+=`<polygon points="${X(R[0].t)},${B} ${pts} ${X(R[R.length-1].t)},${B}" fill="url(#gd)"/><polyline points="${pts}" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/>`;
 if(R.length<=40)s+=R.map(r=>`<circle cx="${X(r.t)}" cy="${Y(r.w)}" r="3" fill="#fff" stroke="#111" stroke-width="1.6"/>`).join('');
 const f=R[0],l=R[R.length-1];
 s+=`<text x="${X(f.t)+4}" y="${Y(f.w)-8}" style="font-weight:700;fill:#888;font-size:11px">${f.w.toFixed(1)}</text><text x="${X(l.t)}" y="${Y(l.w)-9}" text-anchor="end" style="font-weight:800;fill:#111;font-size:12px">${l.w.toFixed(1)}</text><circle cx="${X(l.t)}" cy="${Y(l.w)}" r="5" fill="#111"/>`;
 if(g)s+=`<line x1="${L}" x2="${Rr}" y1="${Y(g)}" y2="${Y(g)}" stroke="#d9534f" stroke-dasharray="5 4"/><text x="${Rr}" y="${Y(g)-5}" text-anchor="end" style="fill:#d9534f;font-weight:700">목표 ${g.toFixed(1)}kg</text>`;
 s+=`<text x="${L}" y="198">${f.k.slice(5).replace('-','.')}</text><text x="${Rr}" y="198" text-anchor="end">${l.k.slice(5).replace('-','.')}</text>`;
 svg.innerHTML=s;
 // stats
 const d=l.w-f.w,pct=d/f.w*100,days=l.t-f.t,pace=days>0?d/days*7:0,avg=R.reduce((a,r)=>a+r.w,0)/R.length;
 const s0=all[0].w,rem=g?l.w-g:null,prog=g&&s0>g?Math.max(0,Math.min(100,(s0-all[all.length-1].w)/(s0-g)*100)):0;
 let msg='';
 if(g){if(rem<=0)msg='🎉 목표를 달성했어요! 지금 체중을 유지해보세요.';
  else if(days<1)msg='기록이 더 쌓이면 추세를 알려드릴게요.';
  else if(pace<-0.05){const eta=new Date((l.t+rem/(-pace/7))*864e5);msg=`👍 목표를 향해 잘 나아가고 있어요. 지금 속도라면 약 ${eta.getUTCFullYear()}년 ${eta.getUTCMonth()+1}월 ${eta.getUTCDate()}일경 도달 예상이에요.`}
  else if(pace<=.05)msg='➡️ 체중이 정체 중이에요. 식단이나 운동 패턴을 점검해보세요.';
  else msg='⚠️ 목표와 반대 방향으로 가고 있어요. 이번 주 식사 기록을 살펴보세요.'}
 const ex=Object.entries(D.days).filter(([k,v])=>v.ex>0&&(!range||dn(k)>T-range)),exs=ex.reduce((a,[k,v])=>a+v.ex,0),exn=ex.length;
 const bmi=+D.height&&l.w?(l.w/Math.pow(D.height/100,2)).toFixed(1):null;
 const cnt={};Object.entries(D.days).forEach(([k,v])=>{if(dn(k)>T-30)(v.stamps||[]).forEach(i=>cnt[i]=(cnt[i]||0)+1)});
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const streak=(()=>{let n=0,t=T;const ks=new Set(all.map(r=>r.t));if(!ks.has(t))t--;while(ks.has(t)){n++;t--}return n})();
 st.innerHTML=`<div class="mut" style="font-weight:700">${range?'기간':'전체'} 변화</div>
 <div class="chg">${d<0?'↘':d>0?'↗':'→'} ${d>0?'+':''}${d.toFixed(1)}<small> kg</small><span class="pill">${pct>0?'+':''}${pct.toFixed(1)}%</span></div>
 <div class="g3"><div class="mini"><span>평균</span><b>${avg.toFixed(1)}kg</b></div><div class="mini"><span>페이스</span><b>${pace>0?'+':''}${pace.toFixed(1)}/주</b></div><div class="mini"><span>연속 기록</span><b>${streak}일</b></div></div>
 <div class="mini" style="margin-top:8px"><span>🏃 ${range?'기간':'전체'} 운동</span><b>${exs.toFixed(1).replace(/\.0$/,'')}시간 · ${exn}일</b></div>
 ${g?`<div style="margin-top:16px"><div class="mut" style="font-weight:700">목표까지 ${rem>0?rem.toFixed(1)+'kg 남음':'달성!'}</div><div class="bar"><i style="width:${prog}%"></i></div><div class="mut">시작 ${s0.toFixed(1)}kg → 목표 ${g.toFixed(1)}kg · ${prog.toFixed(0)}% 진행</div><p class="msg">${msg}</p></div>`:'<p class="mut">설정에서 목표 체중을 입력해보세요.</p>'}
 ${bmi?`<p class="mut">현재 BMI ${bmi}</p>`:''}
 ${top.length?`<div class="mut" style="font-weight:700;margin-top:10px">최근 30일 스탬프</div><div class="sc">${top.map(([i,c])=>`<span>${STAMPS[i][0]} ${c}</span>`).join('')}</div>`:''}`}

home();
